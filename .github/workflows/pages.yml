name: Udgiv til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# configure-pages slår Pages til på repoet ved første kørsel (enablement),
# så der skal ikke klikkes noget i indstillingerne.
permissions:
  contents: read
  pages: write
  id-token: write

# Én udgivelse ad gangen, og lad en igangværende gøre sig færdig.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Kun det siden skal bruge. tools/ er byggeværktøj og hører ikke til
      # på webstedet — det er 1 MB berigelsesdata der aldrig hentes af browseren.
      - name: Saml site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/players.js _site/data/
          echo "Udgivet $(date -u +%FT%TZ) fra ${GITHUB_SHA::7}" > _site/build.txt
          ls -laR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
