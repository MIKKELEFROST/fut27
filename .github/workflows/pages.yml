name: Udgiv til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages på dette repo blev slået til ved at oprette gh-pages-branchen, og
# kilden er derfor "deploy from a branch". Actions-tokenet må ikke oprette et
# Pages-site (configure-pages med enablement: true fejler med "Resource not
# accessible by integration"), så vi udgiver ved at skrive til branchen i
# stedet for at bruge deploy-pages.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kun det siden skal bruge. tools/ er byggeværktøj og hører ikke til på
      # webstedet — blandt andet 1 MB berigelsesdata browseren aldrig henter.
      - name: Saml site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/players.js _site/data/
          cp -r assets _site/
          touch _site/.nojekyll
          echo "Udgivet $(date -u +%FT%TZ) fra ${GITHUB_SHA::7}" > _site/build.txt
          ls -la _site _site/data _site/assets

      # gh-pages er en genereret branch uden egen historik at bevare, så
      # force-push er det rigtige her.
      - name: Udgiv til gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Udgiv ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
